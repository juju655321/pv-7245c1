<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mines &amp; Megawatts · West Virginia (private prototype)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M0 0h16L0 16z%22 fill=%22%23c9a227%22/%3E%3Cpath d=%22M16 0v16H0z%22 fill=%22%230079c1%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-t">
  <form id="gate-f" autocomplete="off">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b id="gate-t">Mines &amp; Megawatts</b></div>
    <p>Private prototype. Enter the preview password.</p>
    <input id="gate-p" type="password" aria-label="Preview password" placeholder="Password" required>
    <button type="submit">Open</button>
    <p id="gate-e" class="err" role="alert"></p>
    <p class="fine">Simple page gate for a test build, not real security.</p>
  </form>
</div>

<header id="top">
  <button id="btn-panel" class="iconbtn" aria-label="Show or hide layers panel" aria-expanded="true">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <span class="mark" aria-hidden="true"></span>
  <h1>Mines &amp; Megawatts <span class="sub">West Virginia</span></h1>
  <span class="badge">Prototype</span>
  <span class="grow"></span>
  <button id="btn-about" class="textbtn">Sources</button>
</header>

<div id="cards" aria-label="Key numbers"></div>
<div id="scope"></div>

<aside id="panel" aria-label="Layers and sections">
  <div class="sheet-handle" id="panel-handle"><span></span></div>
  <div class="tabs" role="tablist">
    <button role="tab" class="tab on" data-tab="layers" aria-selected="true">Layers</button>
    <button role="tab" class="tab" data-tab="charts" aria-selected="false">Charts</button>
  </div>
  <div id="sections" class="tabpane on" data-pane="layers"></div>
  <div id="charts-m" class="tabpane" data-pane="charts"></div>
</aside>

<div id="map" aria-label="Map"></div>

<div id="legend" class="box"><button id="legend-h" aria-expanded="true">Legend</button><div id="legend-b"></div></div>

<section id="charts" class="box" aria-label="Charts"></section>

<aside id="detail" class="box" aria-live="polite" hidden></aside>

<div id="about" role="dialog" aria-modal="true" hidden></div>

<div id="disc">For information only. <b>Not for engineering, legal, or investment decisions.</b> Estimates are labeled. ⚠ = unverified.</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
